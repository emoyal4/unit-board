<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>שבצ״ק</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Hebrew:wght@400;500;600&family=Secular+One&display=swap">
<style>
/* Layout: password, then a name pick after every typed password (a saved login keeps the name); tabs for "שלי" (next mission), the day board (day dropdown, three 8h shift bands, 24h posts) and leave. */
:root{
  --bg:#f1f0ea; --surface:#fbfaf6; --ink:#1d221e; --muted:#676c63; --line:#d8d6cb; --accent:#2c5a4c; --accent-ink:#ffffff;
  --m-patrol:#355f91; --m-carmel:#4c7436; --m-carmel-b:#2f7a6e; --m-yz:#a86a1f; --m-guard:#7d4872; --warn:#b4401a; --hl:#fff1b8; --hl-ink:#1d221e; --under:#2f6f9f;
  --owed:#2e8a4e; --owed-soft:#dcf0e2; --over:#c8382e; --over-soft:#fbe2df;
  --f-display:"Secular One","IBM Plex Sans Hebrew",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Hebrew",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121512; --surface:#1a1e1a; --ink:#e6e5de; --muted:#9a9e94; --line:#2d322d; --accent:#7fb5a2; --accent-ink:#0f1411;
  --m-patrol:#7ea6d8; --m-carmel:#94c07a; --m-carmel-b:#6fc2b4; --m-yz:#e0a85c; --m-guard:#c993bd; --warn:#f08a5d; --hl:#5a4a12; --hl-ink:#fff6d6; --under:#7fb0dc; --owed:#6fcf8f; --owed-soft:#173524; --over:#f07a6f; --over-soft:#4a1f1b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121512; --surface:#1a1e1a; --ink:#e6e5de; --muted:#9a9e94; --line:#2d322d; --accent:#7fb5a2; --accent-ink:#0f1411;
  --m-patrol:#7ea6d8; --m-carmel:#94c07a; --m-carmel-b:#6fc2b4; --m-yz:#e0a85c; --m-guard:#c993bd; --warn:#f08a5d; --hl:#5a4a12; --hl-ink:#fff6d6; --under:#7fb0dc; --owed:#6fcf8f; --owed-soft:#173524; --over:#f07a6f; --over-soft:#4a1f1b; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0}
h1{font-size:1.6rem;line-height:1.2}
h2{font-size:1.15rem}
[hidden]{display:none!important}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* gate */
.gate{min-height:70vh;display:grid;place-items:center}
.gate form{box-sizing:border-box;display:grid;gap:12px;width:min(360px,100%);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px}
.gate input#pw,.gate input#whoIn{box-sizing:border-box;width:100%;min-width:0}
.gate input.masked{-webkit-text-security:disc;text-security:disc}
.gate input#pw{font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.btn{padding:10px 14px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer}
.err{color:var(--warn);min-height:1.5em;margin:0}

/* top */
header.top{display:flex;flex-wrap:nowrap;align-items:center;justify-content:space-between;gap:8px 16px;margin-bottom:14px}
.gate input#whoIn{font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.opts{display:grid;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.opts:empty{display:none}
.opt{text-align:start;padding:9px 12px;border:0;border-bottom:1px solid var(--line);background:var(--surface);cursor:pointer}
.opt:last-child{border-bottom:0}
.opt[aria-pressed="true"]{background:var(--hl);color:var(--hl-ink)}
.btn:disabled{opacity:.5;cursor:default}
.btn.sec{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.daysel{font-size:16px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin-bottom:12px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.tab{padding:8px 14px;white-space:nowrap;border:0;background:none;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--accent);font-weight:600}

/* board */
.meta{display:flex;flex-wrap:wrap;gap:6px 20px;margin-bottom:14px;font-size:.92rem}
.meta b{font-weight:600}
.band{display:grid;grid-template-columns:124px repeat(var(--n,2),minmax(0,1fr));gap:10px;align-items:stretch;margin-bottom:10px}
.band .when{display:flex;flex-direction:column;justify-content:center;gap:2px;border-inline-start:3px solid var(--line);padding-inline-start:10px;white-space:nowrap}
.band.night .when{border-color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.card .k{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.card .k span:first-child{font-weight:600;font-size:.82rem;letter-spacing:.03em}
.card ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.card li{display:flex;justify-content:space-between;gap:8px;border-radius:4px;padding:1px 4px;margin-inline:-4px}
.card li .r{color:var(--muted);font-size:.8rem}
.card li.cmd .nm{font-weight:600}
.card li.me{background:var(--hl);color:var(--hl-ink)}
.card li.me .r{color:inherit}
.c-patrol .k span:first-child{color:var(--m-patrol)} .c-patrol{border-top:3px solid var(--m-patrol)}
.c-carmel .k span:first-child{color:var(--m-carmel)} .c-carmel{border-top:3px solid var(--m-carmel)}
.c-carmel-b .k span:first-child{color:var(--m-carmel-b)} .c-carmel-b{border-top:3px solid var(--m-carmel-b)}
.c-yz .k span:first-child{color:var(--m-yz)} .c-yz{border-top:3px solid var(--m-yz)}
.c-guard .k span:first-child{color:var(--m-guard)} .c-guard{border-top:3px solid var(--m-guard)}
.posts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
.colhead{display:grid;grid-template-columns:124px repeat(var(--n,2),minmax(0,1fr));gap:10px;margin-bottom:6px;font-size:.8rem;color:var(--muted)}
.empty{color:var(--muted);font-style:italic}
.band.is-now .when{border-color:var(--accent)}
.band.is-now .card{border-color:var(--accent)}
.card li.on{outline:2px solid var(--accent);outline-offset:-1px}
.nowtag{color:var(--accent);font-size:.8rem;font-weight:600}
.hamal-now{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:10px 14px;margin-bottom:14px}
.hamal-now .lb{font-size:.8rem;color:var(--muted)}
.hamal-now .call{padding:8px 14px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-weight:600;text-decoration:none;white-space:nowrap}
a.tel{color:var(--accent);text-decoration:none;font-size:.85rem}
.card li a.call{padding:0 8px;border-radius:6px;background:var(--accent);color:var(--accent-ink);font-size:.8rem;font-weight:600;text-decoration:none;white-space:nowrap}
@media (max-width:640px){
  .band,.colhead{grid-template-columns:1fr}
  .colhead{display:none}
  .band .when{flex-direction:row;gap:10px;align-items:baseline;border-inline-start-width:3px}
  .posts{grid-template-columns:1fr}
  .daysel{width:100%;box-sizing:border-box}
  .tab{padding-inline:9px}
}

/* me */
.next{background:var(--surface);border:2px solid var(--accent);border-radius:14px;padding:14px;margin-bottom:16px}
.next .k{font-size:.82rem;color:var(--muted)}
.next .big{font-family:var(--f-display);font-size:1.6rem;line-height:1.2;margin:2px 0}
.next .tm{font-size:1.25rem}
.next .with{font-size:.88rem;color:var(--muted);margin-top:6px}
.trip .with{grid-column:1/-1;font-size:.82rem;color:var(--muted)}
.menu{position:relative}
.menu-btn{width:40px;height:36px;padding:0;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;font-size:1.2rem;line-height:1}
.menu [role="menu"]{position:absolute;inset-inline-end:0;top:calc(100% + 6px);z-index:5;display:grid;min-width:150px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.15);overflow:hidden}
.menu [role="menuitem"]{text-align:start;padding:11px 14px;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer}
.menu [role="menuitem"]:last-child{border-bottom:0}
.menu [role="menuitem"]:hover,.menu [role="menuitem"]:focus-visible{background:var(--bg)}
.menu [role="menuitem"]:focus-visible{outline-offset:-2px}
.chip{padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:.88rem}

/* leave */
.lv-next{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:14px 16px;display:grid;gap:6px;margin-bottom:18px}
.lv-next .lbl{font-size:.8rem;opacity:.85}
.lv-next .when{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.lv-next .big{font-family:var(--f-display);font-size:1.4rem;line-height:1.2}
.lv-next .sub{font-size:.88rem;opacity:.9}
.lv-h{font-size:1rem;margin-bottom:8px}
.trips{display:grid;gap:6px}
.trip{display:grid;grid-template-columns:1fr auto;gap:2px 10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.trip .d{font-weight:600}
.trip .n{grid-row:span 2;align-self:center;font-size:.85rem;font-variant-numeric:tabular-nums;border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.trip .r{font-size:.82rem;color:var(--muted)}
.trip.past{opacity:.5}
.tag{display:inline-block;font-size:.72rem;font-weight:600;padding:0 7px;border-radius:999px;border:1px solid var(--m-yz);color:var(--m-yz);margin-inline-start:6px}
.lv-foot{font-size:.8rem;color:var(--muted);margin-top:14px}

/* dept */
.counts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.counts span{font-size:.85rem;border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:var(--surface)}
.ppl{display:grid;gap:6px}
.pp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.pp.home{opacity:.6}
.pp .nm{font-weight:600}
.pp .st{font-size:.85rem;color:var(--muted)}
.pp .st.cur{color:var(--ink)}
.pp .st.done{text-decoration:line-through}
.pp .nowtag{margin-inline-start:6px}

/* fair */
#v-fair .sub{margin:0 0 12px;color:var(--muted);font-size:.85rem}
#v-fair .list{background:var(--surface);border:1px solid var(--line);border-radius:10px}
#v-fair details+details{border-top:1px solid var(--line)}
#v-fair summary{list-style:none;cursor:pointer;padding:10px 14px;display:grid;grid-template-columns:1fr auto auto;gap:6px 16px;align-items:center}
#v-fair summary::-webkit-details-marker{display:none}
#v-fair summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
#v-fair .who{min-width:0}
#v-fair .who::before{content:"‹";display:inline-block;width:14px;color:var(--muted);transition:transform .15s}
#v-fair details[open] .who::before{transform:rotate(-90deg)}
#v-fair .dept{color:var(--muted);font-size:.8rem;margin-inline-start:6px;white-space:nowrap}
#v-fair .stat{text-align:center;font-variant-numeric:tabular-nums;min-width:92px;position:relative}
#v-fair .stat b{font-family:var(--f-display);font-weight:400;font-size:1.05rem;border-radius:6px;padding:0 6px}
#v-fair b.owed{background:var(--owed-soft);color:var(--owed)}
#v-fair b.over{background:var(--over-soft);color:var(--over)}
#v-fair .stat small{display:block;color:var(--muted);font-size:.75rem;line-height:1.2}
#v-fair .head{padding:6px 14px;display:grid;grid-template-columns:1fr auto auto;gap:16px;color:var(--muted);font-size:.8rem;border-bottom:1px solid var(--line)}
#v-fair .head span:not(:first-child){min-width:92px;text-align:center}
#v-fair .body{padding:0 14px 12px;padding-inline-start:34px}
#v-fair .mix{display:grid;gap:6px}
#v-fair .m{display:grid;grid-template-columns:76px 1fr 64px;gap:10px;align-items:center;font-size:.85rem;padding-bottom:20px}
#v-fair .m .num{color:var(--muted);text-align:end;position:relative}
#v-fair .m .num b{color:var(--ink);font-weight:500}
#v-fair .how{color:var(--muted);font-size:.8rem}
#v-fair .how summary{display:inline;padding:0;text-decoration:underline}
#v-fair .raw{display:block;color:var(--muted);font-size:.75rem}
#v-fair .dv{position:relative;height:12px;background:var(--bg);border-radius:3px}
#v-fair .dv::after{content:"";position:absolute;top:-3px;bottom:-3px;left:50%;width:2px;margin-left:-1px;background:var(--ink)}
#v-fair .dv span{position:absolute;inset-block:1px}
#v-fair .dv span.owed{background:var(--owed);left:50%;border-radius:0 3px 3px 0}
#v-fair .dv span.over{background:var(--over);right:50%;border-radius:3px 0 0 3px}
#v-fair .dv small.avg{position:absolute;top:20px;left:50%;transform:translateX(-50%);font-size:.7rem;line-height:1;color:var(--muted);font-variant-numeric:tabular-nums}
#v-fair em.d{font-style:normal;font-size:.75rem;color:var(--accent);font-variant-numeric:tabular-nums}
#v-fair .stat em.d{position:absolute;top:0;inset-inline-end:0}
#v-fair .m .num em.d{position:absolute;top:50%;transform:translateY(-50%);inset-inline-start:0}
@media (max-width:430px){#v-fair summary,#v-fair .head{gap:6px 10px;padding-inline:10px}#v-fair .stat,#v-fair .head span:not(:first-child){min-width:64px;max-width:76px}#v-fair .body{padding-inline:10px}#v-fair .m{grid-template-columns:56px 1fr 48px;gap:8px}}
@media (prefers-reduced-motion:reduce){#v-fair .who::before{transition:none}}
</style>

<div class="wrap" dir="rtl" lang="he">
  <section class="gate" id="gate">
    <form id="gateForm" autocomplete="off">
      <h1>שבצ״ק</h1>
      <p class="muted" style="margin:0">הלוח מוצפן. הכניסו את סיסמת הפלוגה.</p>
      <label for="pw" class="muted" style="font-size:.85rem">סיסמה</label>
      <input id="pw" type="text" dir="ltr" class="masked" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" required>
      <label style="display:flex;gap:8px;align-items:center;font-size:.85rem" class="muted"><input id="showpw" type="checkbox"> הצגת הסיסמה</label>
      <button class="btn" id="unlock" type="submit">פתיחה</button>
      <p class="err" id="err" role="alert"></p>
    </form>
  </section>

  <section class="gate" id="who" hidden>
    <form id="whoForm" autocomplete="off">
      <h1>שבצ״ק</h1>
      <p class="muted" style="margin:0">מי אתם? בוחרים פעם אחת, והשם נשמר בטלפון עד שתתנתקו.</p>
      <label for="whoIn" class="muted" style="font-size:.85rem">השם שלי</label>
      <input id="whoIn" type="text" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="התחילו להקליד">
      <div class="opts" id="whoList"></div>
      <button class="btn" id="whoGo" type="submit" disabled>המשך</button>
      <button class="btn sec" id="whoBack" type="button">חזרה</button>
    </form>
  </section>

  <main id="app" hidden>
    <header class="top">
      <h1 id="hello"></h1>
      <div class="menu"><button class="menu-btn" id="menuBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="menu" aria-label="תפריט">⋯</button><div id="menu" role="menu" hidden><button role="menuitem" id="rename" type="button">החלף שם</button><button role="menuitem" id="lock" type="button">יציאה</button></div></div>
    </header>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="t-me" aria-selected="true" data-view="me">המשימות שלי</button>
      <button class="tab" role="tab" id="t-board" aria-selected="false" data-view="board">לוח</button>
      <button class="tab" role="tab" id="t-leave" aria-selected="false" data-view="leave">חופשות</button>
      <button class="tab" role="tab" id="t-dept" aria-selected="false" data-view="dept" hidden>המחלקה שלי</button>
      <button class="tab" role="tab" id="t-fair" aria-selected="false" data-view="fair" hidden>הוגנות</button>
    </div>
    <section id="v-board"></section>
    <section id="v-me" hidden></section>
    <section id="v-leave" hidden></section>
    <section id="v-dept" hidden></section>
    <section id="v-fair" hidden></section>

<script>
(function(){
  const $=(s)=>document.querySelector(s);
  const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
  const esc=(s)=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const b64=(s)=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const P=JSON.parse($("#payload").textContent);
  let D=null, WHO=[], day=null, me=store.get("mp_me")||"", view="me", pick="", picked=false;
  const KCLASS={duty:"c-yz",guard:"c-guard"}, CREWCLASS=["c-patrol","c-carmel","c-carmel-b"];
  const mcls=(m)=>m.kind==="crew"?CREWCLASS[day.missions.filter(x=>x.kind==="crew").indexOf(m)]||"":KCLASS[m.kind];

  async function decrypt(pw,box){
    const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(box.salt),iterations:P.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
    const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(box.iv)},key,b64(box.ct));
    return new TextDecoder().decode(pt);
  }
  async function open(pw,silent){
    let txt, cmd=null;
    try{ txt=await decrypt(pw,P); }catch(e){
      try{ cmd=JSON.parse(await decrypt(pw,P.cmd)); txt=await decrypt(cmd.pw,P); delete cmd.pw; }
      catch(e2){ if(!silent) $("#err").textContent="הסיסמה לא נכונה. נסו שוב או בקשו את הסיסמה העדכנית מהמפקד."; store.del("mp_pw"); return; }
    }
    try{ D=JSON.parse(txt); if(cmd){ Object.assign(D.leave,cmd.leave); D.leads=cmd.leads; D.fair=cmd.fair; D.noFair=cmd.noFair; } WHO=Object.keys(cmd?D.leads:D.leave); }catch(e){ $("#err").textContent="הנתונים בדף פגומים. בקשו מהמפקד לפרסם את הלוח מחדש."; return; }
    store.set("mp_pw",pw);
    $("#gate").hidden=true;
    day=curDay()||D.days[D.days.length-1];
    if(silent && WHO.includes(me)) showApp(); else { me=""; askName(); }
  }
  function showApp(){ $("#who").hidden=true; $("#app").hidden=false; render(); }
  function askName(){
    pick=""; $("#who").hidden=false; $("#app").hidden=true; $("#whoIn").value=""; listNames(); $("#whoIn").focus();
  }
  function listNames(){
    const q=$("#whoIn").value.trim();
    const ns=q?WHO.filter(n=>n.includes(q)).sort((a,b)=>a.localeCompare(b,"he")).slice(0,8):[];
    $("#whoList").innerHTML=ns.map(n=>`<button type="button" class="opt" data-n="${esc(n)}" aria-pressed="${n===pick}">${esc(n)} <span class="muted">· ${esc(D.leave[n].dept)}</span></button>`).join("");
    $("#whoGo").disabled=!pick;
    document.querySelectorAll("#whoList .opt").forEach(b=>b.addEventListener("click",()=>{pick=b.dataset.n;listNames();}));
  }
  $("#whoIn").addEventListener("input",()=>{pick="";listNames();});
  $("#whoForm").addEventListener("submit",(e)=>{e.preventDefault(); if(!pick) return; me=pick; store.set("mp_me",me); showApp();});
  $("#gateForm").addEventListener("submit",(e)=>{e.preventDefault();$("#err").textContent="";open($("#pw").value.trim().normalize("NFC"),false);});
  $("#showpw").addEventListener("change",(e)=>{const el=$("#pw"),v=el.value;el.classList.toggle("masked",!e.target.checked);el.style.webkitTextSecurity=e.target.checked?"none":"disc";el.value="";el.value=v;});
  const menu=(on)=>{$("#menu").hidden=!on;$("#menuBtn").setAttribute("aria-expanded",String(on));if(on)$("#rename").focus();};
  $("#menuBtn").addEventListener("click",()=>menu($("#menu").hidden));
  document.addEventListener("click",(e)=>{if(!$("#menu").hidden&&!e.target.closest(".menu")) menu(false);});
  document.addEventListener("keydown",(e)=>{if(e.key==="Escape"&&!$("#menu").hidden){menu(false);$("#menuBtn").focus();}});
  $("#menu").addEventListener("click",()=>menu(false));
  $("#rename").addEventListener("click",askName);
  const toGate=()=>{store.del("mp_pw");store.del("mp_me");me="";D=null;$("#app").hidden=true;$("#who").hidden=true;$("#gate").hidden=false;$("#pw").value="";};
  $("#whoBack").addEventListener("click",()=>WHO.includes(me)?showApp():toGate());
  $("#lock").addEventListener("click",toGate);
  document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{view=t.dataset.view;render();t.scrollIntoView({block:"nearest",inline:"nearest"});}));

  function li(p,live){const cmd=p.role==="מפקד";return `<li class="${cmd?"cmd":""}${p.n===me?" me":""}"><span class="nm">${esc(p.n)}</span>${live&&cmd&&p.phone&&p.n!==me?`<a class="call" href="tel:${esc(p.phone.replace(/[^0-9+]/g,""))}">התקשר</a>`:""}${p.role==="נהג"?'<span class="r">נהג</span>':""}</li>`;}
  function crewCard(m,c,live){return `<div class="card ${mcls(m)}"><div class="k"><span>${esc(m.name)}</span></div>${c.members.length?`<ul>${c.members.map(p=>li(p,live)).join("")}</ul>`:`<div class="empty">לא שובץ</div>`}</div>`;}

  const hr=(s)=>{const [a,b]=s.split(":");return +a+(+b||0)/60;};
  const pad=(n)=>String(n).padStart(2,"0");
  const isoOf=(d)=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`, isoToday=()=>isoOf(new Date());
  const s0Of=(d)=>hr(d.shifts[0].split("–")[0]);
  function boardIso(){
    const d=new Date(), td=D.days.find(x=>x.date===isoOf(d));
    if(d.getHours()+d.getMinutes()/60<s0Of(td||D.days[0]||{shifts:["06:00"]})) d.setDate(d.getDate()-1);
    return isoOf(d);
  }
  const curDay=()=>D.days.find(x=>x.date===boardIso())||null;
  const at=(d,h)=>{const t=new Date(d.date+"T00:00");if(h<s0Of(d))t.setDate(t.getDate()+1);t.setHours(Math.floor(h),Math.round(h%1*60));return t;};
  function nowFor(){
    const d=new Date(), t=d.getHours()+d.getMinutes()/60;
    const live=curDay();
    const target=live||(day.test?day:null);
    if(!target||target!==day) return null;
    const s0=day.shifts[0].split("–")[0];
    const since=(s)=>(t-hr(s)+24)%24;
    const sg=day.missions.find(m=>m.kind==="guard"), yz=day.missions.find(m=>m.kind==="duty");
    return {live:!!live, clock:`${pad(d.getHours())}:${pad(d.getMinutes())}`,
      shift:Math.floor(since(s0)/8)%3,
      turn:sg?sg.turns.find(x=>since(x.time.split("–")[0])<4):null,
      yzOn:yz?since(yz.start)<yz.duration:false};
  }

  function renderBoard(){
    if(!day){$("#v-board").innerHTML=`<p class="muted">אין עדיין לוח משימות מאושר.</p>`;return;}
    const crews=day.missions.filter(m=>m.kind==="crew");
    const yz=day.missions.find(m=>m.kind==="duty"), sg=day.missions.find(m=>m.kind==="guard");
    const N=nowFor(), hm=day.hamal||[];
    const tel=(p)=>p?`<a class="tel mono" href="tel:${esc(p.replace(/[^0-9+]/g,""))}" dir="ltr">${esc(p)}</a>`:"";
    let h=daySel();
    const hn=N&&hm[N.shift];
    if(hn&&hn.n) h+=`<div class="hamal-now"><div><div class="lb">חמ״ל במשמרת עכשיו</div><b>${esc(hn.n)}</b> ${tel(hn.phone)}</div>${hn.phone?`<a class="call" href="tel:${esc(hn.phone.replace(/[^0-9+]/g,""))}">התקשר</a>`:""}</div>`;
    h+=`<div class="meta">${day.officer?`<span>קצין תורן: <b>${esc(day.officer)}</b></span>`:""}${day.sector?`<span>מפקד גזרה: <b>${esc(day.sector)}</b></span>`:""}${day.medic?`<span>חובש: <b>${esc(day.medic)}</b></span>`:""}</div>`;
    h+=`<div class="colhead"><span>משמרת</span>${crews.map(m=>`<span>${esc(m.name)}</span>`).join("")}</div>`;
    day.shifts.forEach((t,i)=>{
      h+=`<div class="band${i===2?" night":""}${N&&N.shift===i?" is-now":""}"><div class="when"><span class="mono">${esc(t)}</span><span class="muted" style="font-size:.8rem">${["בוקר","ערב","לילה"][i]||""}</span>${N&&N.shift===i?'<span class="nowtag">● עכשיו</span>':""}</div>${crews.map(m=>crewCard(m,m.crews[i],N&&N.shift===i)).join("")}</div>`;
    });
    h+=`<div class="posts">`;
    const ul=(xs,f)=>xs.length?`<ul>${xs.map(f).join("")}</ul>`:`<div class="empty">לא שובץ</div>`;
    if(yz) h+=`<div class="card c-yz"><div class="k"><span>${esc(yz.name)} · ${esc(yz.duration)} ש׳</span><span class="mono muted">${yz.hours===false?"":esc(yz.time)}</span></div>${ul(yz.members,p=>li(p,N&&N.yzOn))}</div>`;
    if(sg) h+=`<div class="card c-guard"><div class="k"><span>${esc(sg.name)}</span><span></span></div>${ul(sg.turns,t=>`<li class="${t.n===me?"me":""}${N&&N.turn===t?" on":""}"><span class="nm">${esc(t.n)}</span><span class="r mono">${esc(t.time)}</span></li>`)}</div>`;
    h+=`</div>`;
    $("#v-board").innerHTML=h;
    $("#v-board").style.setProperty("--n",crews.length);
    bindDaySel("#v-board");
  }
  function daySel(){
    const cd=curDay();
    return `<select class="daysel" aria-label="יום">${D.days.map(d=>`<option value="${d.date}"${d===day?" selected":""}>${d===cd?"היום · ":""}${esc(d.label)}</option>`).join("")}</select>`;
  }
  function bindDaySel(sec){ $(sec+" .daysel").onchange=(e)=>{day=D.days.find(d=>d.date===e.target.value);picked=true;render();}; }

  const SH=["בוקר","ערב","לילה"], dkey=(x)=>x.toDateString();
  function daySlots(d){
    const out=[];
    const add=(n,role,m,lab,time,ms,shown=time)=>{const [a,b]=time.split("–"),ha=hr(a),st=at(d,ha);const en=new Date(st.getTime()+((hr(b)-ha+24)%24||24)*36e5);out.push({n,role,m,lab,time:shown,ms,st,en});};
    d.missions.forEach(m=>{
      if(m.kind==="crew") m.crews.forEach((c,i)=>c.members.forEach(p=>add(p.n,p.role,m.name,SH[i],c.time,c.members)));
      if(m.kind==="duty") m.members.forEach(p=>add(p.n,p.role,m.name,"",m.time,m.members,m.hours===false?"":m.time));
      if(m.kind==="guard") m.turns.forEach(x=>add(x.n,"",m.name,"",x.time,[]));
    });
    (d.hamal||[]).forEach((x,i)=>{if(x.n) add(x.n,"","חמ״ל",SH[i],d.shifts[i],[]);});
    return out;
  }
  const mySlots=(n)=>D.days.flatMap(daySlots).filter(s=>s.n===n).sort((a,b)=>a.st-b.st);
  const withTxt=(s)=>s.ms.filter(p=>p.n!==me).map(p=>p.role==="מפקד"?`<b>${esc(p.n)}</b> (מפקד)`:p.role==="נהג"?`${esc(p.n)} (נהג)`:esc(p.n)).join(" · ");
  function whenLbl(st){const t=new Date(),m=new Date();m.setDate(t.getDate()+1);return dkey(st)===dkey(t)?"היום":dkey(st)===dkey(m)?"מחר":`${pad(st.getDate())}.${pad(st.getMonth()+1)}`;}
  function nextCard(){
    const now=new Date(), sl=mySlots(me).filter(s=>s.en>now);
    if(!sl.length) return "";
    const a=sl[0], on=a.st<=now, ttl=(s)=>esc(s.m)+(s.lab?" · "+s.lab:"");
    const others=withTxt(a);
    return `<div class="next"><div class="k">${on?"עכשיו במשימה":"המשימה הבאה שלך · "+whenLbl(a.st)}</div><div class="big">${ttl(a)}</div><div class="tm mono">${esc(a.time)}</div>${others?`<div class="with">עם ${others}</div>`:""}</div>`;
  }
  function renderMe(){
    const rest=mySlots(me).filter(s=>s.en>new Date()).slice(1), t0=boardIso();
    const duty=D.days.filter(d=>d.date>=t0).flatMap(d=>[[d,D.leads&&D.leads[me]&&d.officer===me&&"קצין תורן"],[d,D.leads&&D.leads[me]&&d.sector===me&&"מפקד גזרה"],[d,d.medic===me&&"חובש"]]).filter(x=>x[1]);
    $("#v-me").innerHTML=(duty.length?`<div class="trips">`+duty.map(([d,r])=>`<div class="trip"><span class="d">${d.date===t0?"היום":whenLbl(dOf(d.date))} · ${r}</span></div>`).join("")+`</div>`:"")+(nextCard()||(duty.length?"":`<p class="muted">אין לך משימה בלוח כרגע.</p>`))+(rest.length?`<h2 class="lv-h">המשימות הבאות</h2><div class="trips">`+rest.map(s=>{const w=withTxt(s);return `<div class="trip"><span class="d">${whenLbl(s.st)} · ${esc(s.m)}${s.lab?" · "+s.lab:""}</span>${s.time?`<span class="n mono">${esc(s.time)}</span>`:""}${w?`<span class="with">עם ${w}</span>`:""}</div>`;}).join("")+`</div>`:"");
  }

  const DL=["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];
  const dOf=(iso)=>new Date(iso+"T00:00"), dTxt=(iso)=>{const d=dOf(iso);return `${DL[d.getDay()]} <span class="mono">${d.getDate()}.${d.getMonth()+1}</span>`;};
  const backTxt=(t)=>t.back?`חוזר ${dTxt(t.back)} עד 12:00`:t.to_end?"עד הירידה מהקו":"אין תאריך חזרה בתוכנית";
  function renderLeave(){
    if((D.offDepts||[]).includes(D.leave[me].dept)){$("#v-leave").innerHTML=`<p class="muted">מפקד הכוח צריך לעדכן את היציאות בטבלה</p>`;return;}
    const t0=isoToday(), trips=D.leave[me].trips;
    const cur=trips.find(t=>t.out<=t0&&(!t.back||t.back>t0)), nxt=trips.find(t=>t.out>t0);
    let h="";
    if(cur) h+=`<div class="lv-next"><span class="lbl">אתם בבית עכשיו</span><span class="big">${backTxt(cur)}</span></div>`;
    else if(nxt){const n=Math.round((dOf(nxt.out)-dOf(t0))/864e5);
      h+=`<div class="lv-next"><span class="lbl">היציאה הבאה שלך</span><div class="when"><span class="big">${dTxt(nxt.out)} בבוקר</span><span class="sub">${n===1?"מחר":`בעוד ${n} ימים`}</span></div><span class="sub">${backTxt(nxt)} · ${nxt.days} ימים בבית</span></div>`;}
    if(!trips.length){$("#v-leave").innerHTML=`<p class="muted">אין לך יציאות הביתה בתוכנית.</p>`;return;}
    h+=`<h2 class="lv-h">כל היציאות</h2><div class="trips">`+trips.map(t=>`<div class="trip${t.back&&t.back<=t0?" past":""}"><span class="d">יוצא ${dTxt(t.out)} בבוקר${t.cons?'<span class="tag">אילוץ</span>':""}</span><span class="n">${t.days} ימים</span><span class="r">${backTxt(t)}</span></div>`).join("")+`</div>`;
    h+=`<p class="lv-foot">התוכנית יכולה להשתנות. שינויים מתעדכנים כאן אחרי אישור המפקד.</p>`;
    $("#v-leave").innerHTML=h;
  }

  const CODE=["א","מ","פ","ג"];
  function renderDept(){
    if(!day){$("#v-dept").innerHTML=`<p class="muted">אין עדיין לוח משימות מאושר.</p>`;return;}
    const dept=D.leads[me], now=new Date(), live=day===curDay();
    const arrived=live?now>=at(day,hr(day.arrival||day.shifts[0].split("–")[0])):day.date<boardIso();
    const sl=daySlots(day), slotTxt=(s)=>`${s.st>now?"עולה ל":"ב"}${esc(s.m)}${s.role?" · "+esc(s.role):""}${s.time?` · <span class="mono">${esc(s.time)}</span>`:""}`;
    const ppl=Object.keys(D.leave).filter(n=>D.leave[n].dept===dept).map(n=>{
      const away=day.away[n], duty=n===day.officer?"קצין תורן":n===day.sector?"מפקד גזרה":n===day.medic?"חובש":"";
      const mine=sl.filter(s=>s.n===n).sort((a,b)=>(a.en<=now)-(b.en<=now)||a.st-b.st);
      const cur=mine.some(s=>s.st<=now&&now<s.en), later=mine.some(s=>s.en>now);
      const rank=away!==undefined?3:cur||(duty&&live)?0:later||duty?1:2;
      let st;
      const trip=away!==undefined&&D.leave[n].trips.find(t=>t.out<=day.date&&(!t.back||t.back>day.date));
      if(away!==undefined) st=`<div class="st">בבית${CODE.includes(away)?` (${esc(away)})`:""}${trip?` · ${backTxt(trip)}`:""}</div>`;
      else st=(duty?`<div class="st cur">${duty}</div>`:"")+mine.map(s=>{const on=s.st<=now&&now<s.en,done=s.en<=now;return `<div class="st${on?" cur":done?" done":""}">${slotTxt(s)}${on?'<span class="nowtag">● עכשיו</span>':""}</div>`;}).join("")+(!duty&&!mine.length?`<div class="st">באוויר</div>`:"");
      if(day.back.includes(n)) st+=`<div class="st">${arrived?"חזר":"חוזר"}${live?" היום":""}</div>`;
      return {n,rank,away,first:mine.length?+mine[0].st:Infinity,idle:away===undefined&&!duty&&!mine.length,h:`<div class="pp${away!==undefined?" home":""}"><span class="nm">${esc(n)}</span>${st}</div>`};
    }).sort((a,b)=>a.rank-b.rank||a.first-b.first||a.n.localeCompare(b.n,"he"));
    const home=ppl.filter(p=>p.away!==undefined).length;
    $("#v-dept").innerHTML=daySel()+`<div class="counts"><span>${esc(dept)}</span><span>בבסיס ${ppl.length-home}</span><span>בבית ${home}</span><span>באוויר ${ppl.filter(p=>p.idle).length}</span></div><div class="ppl">${ppl.map(p=>p.h).join("")}</div>`;
    bindDaySel("#v-dept");
  }

  const ORDER=["סיור","כרמל א׳","כרמל ב׳","יזומה","ש.ג"], HALF=["ש.ג","כרמל ב׳"];
  function renderFair(){
    const F=D.fair, P=F.people.map(r=>Object.assign({},r)), LAST=F.days[F.days.length-1];
    P.forEach(r=>{
      r.n8=r.eights.length;
      const js=r.jobs.filter(j=>j.day===LAST);
      r.dS=js.reduce((a,j)=>a+j.w,0);
      r.d8=r.eights.filter(d=>d===LAST).length;
      r.dM={}; js.forEach(j=>r.dM[j.m]=(r.dM[j.m]||0)+j.w);
      r.v={shifts:r.shifts,n8:r.n8};
      ORDER.forEach(m=>r.v[m]=(r.mix[m]||0)*(HALF.includes(m)?0.5:1));
    });
    const days=P.reduce((a,r)=>a+r.onBase,0), AVG={};
    ["shifts","n8",...ORDER].forEach(k=>AVG[k]=days?P.reduce((a,r)=>a+r.v[k],0)/days:0);
    // gap = what he did minus the average rate over his own days on base
    const gap=(r,k)=>r.v[k]-r.onBase*AVG[k], per=(r,k)=>r.onBase?r.v[k]/r.onBase:null;
    const f1=(x)=>(Math.round(x*10)/10).toString(), f2=(x)=>x===null?"—":f1(x);
    const sgn=(x)=>Math.abs(x)<0.05?"0":`<span dir="ltr">${x>0?"+":"−"}${f1(Math.abs(x))}</span>`;
    const cls=(g)=>g<=-0.5?"owed":g>=0.5?"over":"", plus=(x)=>x>0?`<em class="d">+${f1(x)}</em>`:"";
    const MAXG=Math.max(0.5,...P.flatMap(r=>ORDER.map(m=>Math.abs(gap(r,m)))));
    const sub=`<details class="how"><summary>איך זה מחושב?</summary> `+
      `משמרת 8 שעות ויזומה = 1. ש.ג (4 שעות) = 0.5. כרמל ב׳ (כוננות בבסיס) = 0.5, ואין אחריו או לפניו כלל מנוחה. 8/8 = עלה שוב פחות מ-16 שעות אחרי משמרת של 8 שעות, גם באותו יום (בוקר ואז לילה). `+
      `ממוצע = כל המשמרות חלקי כל ימי הבסיס, אותו ממוצע לכולם. המגיע לכל אחד = ימי הבסיס שלו × הממוצע, כדי שמי שהיה בבית לא ייראה כחייב. `+
      `המספר הגדול = כמה משמרות עשה מעל (+) או מתחת (−) למגיע לו. אדום = לפחות חצי משמרת מעל, ירוק = לפחות חצי משמרת מתחת. בפס: הקו באמצע = ממוצע. מסודר מהעמוס ביותר. `+
      `מפקדי המחלקות (${F.skip.map(esc).join(", ")}) לא נספרים.</details>`;
    const rows=[...P].sort((a,b)=>(b.onBase?gap(b,"shifts"):-99)-(a.onBase?gap(a,"shifts"):-99)||b.n8-a.n8||a.name.localeCompare(b.name,"he")).map(r=>{
      const mix=ORDER.map(m=>{const g=gap(r,m),w=Math.min(50,Math.abs(g)/MAXG*50);
        return `<div class="m"><span>${m}</span><div class="dv"><span class="${g<0?"owed":"over"}" style="width:${w}%"></span><small class="avg">${f1(r.onBase*AVG[m])}</small></div><span class="num"><b>${f1(r.v[m])}</b>${plus(r.dM[m]||0)}</span></div>`;}).join("");
      return `<details><summary><span class="who">${esc(r.name)}<span class="dept">${esc(r.dept)}</span><small class="raw">${f1(r.shifts)} משמרות ב-${r.onBase} ימים${r.dS?` · <span dir="ltr">+${f1(r.dS)}</span> ב-${LAST}`:""}</small></span>`+
        `<span class="stat"><b class="${r.onBase?cls(gap(r,"shifts")):""}">${r.onBase?sgn(gap(r,"shifts")):"—"}</b><small>${f2(per(r,"shifts"))} ליום · ממוצע ${f2(AVG.shifts)}</small></span>`+
        `<span class="stat"><b class="${r.onBase?cls(gap(r,"n8")):""}">${r.n8}</b>${plus(r.d8)}<small>ממוצע ${f1(r.onBase*AVG.n8)}</small></span></summary>`+
        `<div class="body"><div class="mix">${r.onBase?mix:"<span class='raw'>לא היה בבסיס</span>"}</div></div></details>`;
    }).join("");
    $("#v-fair").innerHTML=`<div class="sub">${sub}</div><div class="list"><div class="head"><span>שם</span><span>מעל / מתחת</span><span>8/8</span></div>${rows}</div>`;
  }

  function render(){
    const lead=!!(D.leads&&D.leads[me]), fair=lead&&!(D.noFair||[]).includes(me);
    const noMe=(D.offDepts||[]).includes(D.leave[me].dept)&&!D.days.some(d=>d.officer===me||d.sector===me||d.medic===me);
    if((view==="dept"&&!lead)||(view==="fair"&&!fair)||(view==="me"&&noMe)) view=noMe?"board":"me";
    $("#hello").textContent=`שלום, ${me}`;
    $("#t-dept").hidden=!lead;
    $("#t-fair").hidden=!fair;
    $("#t-me").hidden=noMe;
    document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",String(t.dataset.view===view)));
    ["board","me","leave","dept","fair"].forEach(v=>$("#v-"+v).hidden=view!==v);
    ({board:renderBoard,me:renderMe,leave:renderLeave,dept:renderDept,fair:renderFair})[view]();
  }

  setInterval(()=>{
    if(!D||!me||$("#app").hidden||view==="fair"||document.activeElement?.classList.contains("daysel")) return;
    if(!picked) day=curDay()||day;
    render();
  },30000);
  let tag=null;
  async function checkUpdate(){
    try{
      const u=location.href.split("#")[0];
      const h=await fetch(u,{method:"HEAD",cache:"no-cache"}), t=h.headers.get("ETag")||h.headers.get("Last-Modified");
      if(t&&t===tag) return;
      const r=await fetch(u,{cache:"reload"});
      const iv=((await r.text()).match(/"iv":"([^"]+)"/)||[])[1];
      tag=t;
      // cache:"reload" refreshed GitHub's 10-min cached copy; the session flag stops a reload loop if it didn't.
      if(iv&&iv!==P.iv&&sessionStorage.getItem("mp_reloaded")!==iv){sessionStorage.setItem("mp_reloaded",iv);location.reload();}
    }catch(e){}
  }
  document.addEventListener("visibilitychange",()=>{if(!document.hidden) checkUpdate();});
  setInterval(()=>{if(!document.hidden) checkUpdate();},60000);
  checkUpdate();
  const saved=store.get("mp_pw"); if(saved) open(saved,true);
})();
</script>
</body></html>
