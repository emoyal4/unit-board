<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>שבצ״ק</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Hebrew:wght@400;500;600&family=Secular+One&display=swap">
<style>
/* Layout: password, then a name pick after every typed password (a saved login keeps the name); tabs for "שלי" (next mission), the day board (day dropdown, three 8h shift bands, 24h posts) and leave. */
:root{
  --bg:#f1f0ea; --surface:#fbfaf6; --ink:#1d221e; --muted:#676c63; --line:#d8d6cb; --accent:#2c5a4c; --accent-ink:#ffffff;
  --m-patrol:#355f91; --m-carmel:#4c7436; --m-yz:#a86a1f; --m-guard:#7d4872; --warn:#b4401a; --hl:#fff1b8; --hl-ink:#1d221e; --under:#2f6f9f;
  --f-display:"Secular One","IBM Plex Sans Hebrew",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Hebrew",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121512; --surface:#1a1e1a; --ink:#e6e5de; --muted:#9a9e94; --line:#2d322d; --accent:#7fb5a2; --accent-ink:#0f1411;
  --m-patrol:#7ea6d8; --m-carmel:#94c07a; --m-yz:#e0a85c; --m-guard:#c993bd; --warn:#f08a5d; --hl:#5a4a12; --hl-ink:#fff6d6; --under:#7fb0dc; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121512; --surface:#1a1e1a; --ink:#e6e5de; --muted:#9a9e94; --line:#2d322d; --accent:#7fb5a2; --accent-ink:#0f1411;
  --m-patrol:#7ea6d8; --m-carmel:#94c07a; --m-yz:#e0a85c; --m-guard:#c993bd; --warn:#f08a5d; --hl:#5a4a12; --hl-ink:#fff6d6; --under:#7fb0dc; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0}
h1{font-size:1.6rem;line-height:1.2}
h2{font-size:1.15rem}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* gate */
.gate{min-height:70vh;display:grid;place-items:center}
.gate form{box-sizing:border-box;display:grid;gap:12px;width:min(360px,100%);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px}
.gate input#pw,.gate input#whoIn{box-sizing:border-box;width:100%;min-width:0}
.gate input.masked{-webkit-text-security:disc;text-security:disc}
.gate input#pw{font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.btn{padding:10px 14px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer}
.err{color:var(--warn);min-height:1.5em;margin:0}

/* top */
header.top{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:8px 16px;margin-bottom:14px}
.gate input#whoIn{font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.opts{display:grid;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.opts:empty{display:none}
.opt{text-align:start;padding:9px 12px;border:0;border-bottom:1px solid var(--line);background:var(--surface);cursor:pointer}
.opt:last-child{border-bottom:0}
.opt[aria-pressed="true"]{background:var(--hl);color:var(--hl-ink)}
.btn:disabled{opacity:.5;cursor:default}
.daysel{font-size:16px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin-bottom:12px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab{padding:8px 14px;border:0;background:none;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--accent);font-weight:600}

/* board */
.meta{display:flex;flex-wrap:wrap;gap:6px 20px;margin-bottom:14px;font-size:.92rem}
.meta b{font-weight:600}
.band{display:grid;grid-template-columns:110px 1fr 1fr;gap:10px;align-items:stretch;margin-bottom:10px}
.band .when{display:flex;flex-direction:column;justify-content:center;gap:2px;border-inline-start:3px solid var(--line);padding-inline-start:10px}
.band.night .when{border-color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.card .k{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.card .k span:first-child{font-weight:600;font-size:.82rem;letter-spacing:.03em}
.card ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.card li{display:flex;justify-content:space-between;gap:8px;border-radius:4px;padding:1px 4px;margin-inline:-4px}
.card li .r{color:var(--muted);font-size:.8rem}
.card li.cmd .nm{font-weight:600}
.card li.me{background:var(--hl);color:var(--hl-ink)}
.card li.me .r{color:inherit}
.c-patrol .k span:first-child{color:var(--m-patrol)} .c-patrol{border-top:3px solid var(--m-patrol)}
.c-carmel .k span:first-child{color:var(--m-carmel)} .c-carmel{border-top:3px solid var(--m-carmel)}
.c-yz .k span:first-child{color:var(--m-yz)} .c-yz{border-top:3px solid var(--m-yz)}
.c-guard .k span:first-child{color:var(--m-guard)} .c-guard{border-top:3px solid var(--m-guard)}
.posts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
.colhead{display:grid;grid-template-columns:110px 1fr 1fr;gap:10px;margin-bottom:6px;font-size:.8rem;color:var(--muted)}
.empty{color:var(--muted);font-style:italic}
.band.is-now .when{border-color:var(--accent)}
.band.is-now .card{border-color:var(--accent)}
.card li.on{outline:2px solid var(--accent);outline-offset:-1px}
@media (prefers-reduced-motion:no-preference){.now .live::before{animation:pulse 2s ease-in-out infinite}}
@keyframes pulse{50%{opacity:.3}}
@media (max-width:640px){
  .band,.colhead{grid-template-columns:1fr}
  .colhead{display:none}
  .band .when{flex-direction:row;gap:10px;align-items:baseline;border-inline-start-width:3px}
  .posts{grid-template-columns:1fr}
  .daysel{width:100%;box-sizing:border-box}
}

/* me */
.next{background:var(--surface);border:2px solid var(--accent);border-radius:14px;padding:14px;margin-bottom:16px}
.next .k{font-size:.82rem;color:var(--muted)}
.next .big{font-family:var(--f-display);font-size:1.6rem;line-height:1.2;margin:2px 0}
.next .tm{font-size:1.25rem}
.next .with{font-size:.88rem;color:var(--muted);margin-top:6px}
.chip{padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:.88rem}

/* leave */
.lv-next{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:14px 16px;display:grid;gap:6px;margin-bottom:18px}
.lv-next .lbl{font-size:.8rem;opacity:.85}
.lv-next .when{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.lv-next .big{font-family:var(--f-display);font-size:1.4rem;line-height:1.2}
.lv-next .sub{font-size:.88rem;opacity:.9}
.lv-h{font-size:1rem;margin-bottom:8px}
.trips{display:grid;gap:6px}
.trip{display:grid;grid-template-columns:1fr auto;gap:2px 10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.trip .d{font-weight:600}
.trip .n{grid-row:span 2;align-self:center;font-size:.85rem;font-variant-numeric:tabular-nums;border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.trip .r{font-size:.82rem;color:var(--muted)}
.trip.past{opacity:.5}
.tag{display:inline-block;font-size:.72rem;font-weight:600;padding:0 7px;border-radius:999px;border:1px solid var(--m-yz);color:var(--m-yz);margin-inline-start:6px}
.lv-foot{font-size:.8rem;color:var(--muted);margin-top:14px}
</style>

<div class="wrap" dir="rtl" lang="he">
  <section class="gate" id="gate">
    <form id="gateForm" autocomplete="off">
      <h1>שבצ״ק</h1>
      <p class="muted" style="margin:0">הלוח מוצפן. הכניסו את סיסמת הפלוגה.</p>
      <label for="pw" class="muted" style="font-size:.85rem">סיסמה</label>
      <input id="pw" type="text" dir="ltr" class="masked" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" required>
      <label style="display:flex;gap:8px;align-items:center;font-size:.85rem" class="muted"><input id="showpw" type="checkbox"> הצגת הסיסמה</label>
      <button class="btn" id="unlock" type="submit">פתיחה</button>
      <p class="err" id="err" role="alert"></p>
    </form>
  </section>

  <section class="gate" id="who" hidden>
    <form id="whoForm" autocomplete="off">
      <h1>שבצ״ק</h1>
      <p class="muted" style="margin:0">מי אתם? בוחרים פעם אחת, והשם נשמר בטלפון עד שתתנתקו.</p>
      <label for="whoIn" class="muted" style="font-size:.85rem">השם שלי</label>
      <input id="whoIn" type="text" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="התחילו להקליד">
      <div class="opts" id="whoList"></div>
      <button class="btn" id="whoGo" type="submit" disabled>המשך</button>
    </form>
  </section>

  <main id="app" hidden>
    <header class="top">
      <h1 id="hello"></h1>
      <button class="chip" id="lock" type="button">יציאה</button>
    </header>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="t-me" aria-selected="true" data-view="me">המשימות שלי</button>
      <button class="tab" role="tab" id="t-board" aria-selected="false" data-view="board">לוח</button>
      <button class="tab" role="tab" id="t-leave" aria-selected="false" data-view="leave">חופשות</button>
    </div>
    <section id="v-board"></section>
    <section id="v-me" hidden></section>
    <section id="v-leave" hidden></section>
  </main>
</div>

<script>
(function(){
  const $=(s)=>document.querySelector(s);
  const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
  const esc=(s)=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const b64=(s)=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const P=JSON.parse($("#payload").textContent);
  let D=null, day=null, me=store.get("mp_me")||"", view="me", pick="";
  const KCLASS={duty:"c-yz",guard:"c-guard"}, CREWCLASS=["c-patrol","c-carmel"];
  const mcls=(m)=>m.kind==="crew"?CREWCLASS[day.missions.filter(x=>x.kind==="crew").indexOf(m)]||"":KCLASS[m.kind];

  async function decrypt(pw){
    const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.salt),iterations:P.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
    const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.iv)},key,b64(P.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  async function open(pw,silent){
    try{ D=await decrypt(pw); }catch(e){ if(!silent) $("#err").textContent="הסיסמה לא נכונה. נסו שוב או בקשו את הסיסמה העדכנית מהמפקד."; store.del("mp_pw"); return; }
    store.set("mp_pw",pw);
    $("#gate").hidden=true;
    day=D.days.find(d=>d.date===isoToday())||D.days[D.days.length-1];
    if(silent && me in D.leave) showApp(); else askName();
  }
  function showApp(){ $("#who").hidden=true; $("#app").hidden=false; render(); }
  function askName(){
    me=""; pick=""; $("#who").hidden=false; $("#app").hidden=true; $("#whoIn").value=""; listNames(); $("#whoIn").focus();
  }
  function listNames(){
    const q=$("#whoIn").value.trim();
    const ns=q?Object.keys(D.leave).filter(n=>n.includes(q)).sort((a,b)=>a.localeCompare(b,"he")).slice(0,8):[];
    $("#whoList").innerHTML=ns.map(n=>`<button type="button" class="opt" data-n="${esc(n)}" aria-pressed="${n===pick}">${esc(n)} <span class="muted">· ${esc(D.leave[n].dept)}</span></button>`).join("");
    $("#whoGo").disabled=!pick;
    document.querySelectorAll("#whoList .opt").forEach(b=>b.addEventListener("click",()=>{pick=b.dataset.n;listNames();}));
  }
  $("#whoIn").addEventListener("input",()=>{pick="";listNames();});
  $("#whoForm").addEventListener("submit",(e)=>{e.preventDefault(); if(!pick) return; me=pick; store.set("mp_me",me); showApp();});
  $("#gateForm").addEventListener("submit",(e)=>{e.preventDefault();$("#err").textContent="";open($("#pw").value.trim().normalize("NFC"),false);});
  $("#showpw").addEventListener("change",(e)=>{const el=$("#pw"),v=el.value;el.classList.toggle("masked",!e.target.checked);el.style.webkitTextSecurity=e.target.checked?"none":"disc";el.value="";el.value=v;});
  $("#lock").addEventListener("click",()=>{store.del("mp_pw");store.del("mp_me");me="";D=null;$("#app").hidden=true;$("#gate").hidden=false;$("#pw").value="";});
  document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{view=t.dataset.view;render();}));

  function li(p){const cmd=p.role==="מפקד";return `<li class="${cmd?"cmd":""}${p.n===me?" me":""}"><span class="nm">${esc(p.n)}</span>${p.role==="נהג"?'<span class="r">נהג</span>':""}</li>`;}
  function crewCard(m,c){return `<div class="card ${mcls(m)}"><div class="k"><span>${esc(m.name)}</span></div>${c.members.length?`<ul>${c.members.map(li).join("")}</ul>`:`<div class="empty">לא שובץ</div>`}</div>`;}

  const hr=(s)=>{const [a,b]=s.split(":");return +a+(+b||0)/60;};
  const pad=(n)=>String(n).padStart(2,"0");
  const isoOf=(d)=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`, isoToday=()=>isoOf(new Date());
  function nowFor(){
    const s0=day.shifts[0].split("–")[0];
    const d=new Date(), t=d.getHours()+d.getMinutes()/60, start=hr(s0);
    const bd=new Date(d); if(t<start) bd.setDate(bd.getDate()-1);
    const iso=`${bd.getFullYear()}-${pad(bd.getMonth()+1)}-${pad(bd.getDate())}`;
    const live=D.days.find(x=>x.date===iso);
    const target=live||(day.test?day:null);
    if(!target||target!==day) return null;
    const since=(s)=>(t-hr(s)+24)%24;
    const sg=day.missions.find(m=>m.kind==="guard"), yz=day.missions.find(m=>m.kind==="duty");
    return {live:!!live, clock:`${pad(d.getHours())}:${pad(d.getMinutes())}`,
      shift:Math.floor(since(s0)/8)%3,
      turn:sg?sg.turns.find(x=>since(x.time.split("–")[0])<4):null,
      yzOn:yz?since(yz.start)<yz.duration:false};
  }

  function renderBoard(){
    if(!day){$("#v-board").innerHTML=`<p class="muted">אין עדיין לוח משימות מאושר.</p>`;return;}
    const crews=day.missions.filter(m=>m.kind==="crew");
    const yz=day.missions.find(m=>m.kind==="duty"), sg=day.missions.find(m=>m.kind==="guard");
    const N=nowFor();
    let h=`<select id="daySel" class="daysel" aria-label="יום">${D.days.map(d=>`<option value="${d.date}"${d===day?" selected":""}>${d.date===isoToday()?"היום · ":""}${esc(d.label)}</option>`).join("")}</select>`;
    h+=`<div class="meta">${day.officer?`<span>קצין תורן: <b>${esc(day.officer)}</b></span>`:""}${day.sector?`<span>מפקד גזרה: <b>${esc(day.sector)}</b></span>`:""}</div>`;
    h+=`<div class="colhead"><span>משמרת</span>${crews.map(m=>`<span>${esc(m.name)}</span>`).join("")}</div>`;
    day.shifts.forEach((t,i)=>{
      h+=`<div class="band${i===2?" night":""}${N&&N.shift===i?" is-now":""}"><div class="when"><span class="mono">${esc(t)}</span><span class="muted" style="font-size:.8rem">${["בוקר","ערב","לילה"][i]||""}</span>${N&&N.shift===i?'<span class="nowtag">● עכשיו</span>':""}</div>${crews.map(m=>crewCard(m,m.crews[i])).join("")}</div>`;
    });
    h+=`<div class="posts">`;
    if(yz) h+=`<div class="card c-yz"><div class="k"><span>${esc(yz.name)} · 24 ש׳</span><span class="mono muted">${yz.hours===false?"":esc(yz.time)}</span></div><ul>${yz.members.map(li).join("")}</ul></div>`;
    if(sg) h+=`<div class="card c-guard"><div class="k"><span>${esc(sg.name)}</span><span></span></div><ul>${sg.turns.map(t=>`<li class="${t.n===me?"me":""}${N&&N.turn===t?" on":""}"><span class="nm">${esc(t.n)}</span><span class="r mono">${esc(t.time)}</span></li>`).join("")}</ul></div>`;
    h+=`</div>`;
    $("#v-board").innerHTML=h;
    $("#daySel").onchange=(e)=>{day=D.days.find(d=>d.date===e.target.value);render();};
  }

  const SH=["בוקר","ערב","לילה"], dkey=(x)=>x.toDateString();
  function mySlots(n){
    const out=[];
    D.days.forEach(d=>{
      const s0=hr(d.shifts[0].split("–")[0]);
      const add=(m,lab,time,ms,shown=time)=>{const [a,b]=time.split("–"),ha=hr(a),st=new Date(d.date+"T00:00");if(ha<s0)st.setDate(st.getDate()+1);st.setHours(Math.floor(ha),Math.round(ha%1*60));const en=new Date(st.getTime()+((hr(b)-ha+24)%24||24)*36e5);out.push({m,lab,time:shown,ms,st,en});};
      d.missions.forEach(m=>{
        if(m.kind==="crew") m.crews.forEach((c,i)=>{if(c.members.some(p=>p.n===n)) add(m.name,SH[i],c.time,c.members);});
        if(m.kind==="duty"&&m.members.some(p=>p.n===n)) add(m.name,"",m.time,m.members,m.hours===false?"":m.time);
        if(m.kind==="guard") m.turns.filter(x=>x.n===n).forEach(x=>add(m.name,"",x.time,[]));
      });
    });
    return out.sort((a,b)=>a.st-b.st);
  }
  function whenLbl(st){const t=new Date(),m=new Date();m.setDate(t.getDate()+1);return dkey(st)===dkey(t)?"היום":dkey(st)===dkey(m)?"מחר":`${pad(st.getDate())}.${pad(st.getMonth()+1)}`;}
  function nextCard(){
    const now=new Date(), sl=mySlots(me).filter(s=>s.en>now);
    if(!sl.length) return "";
    const a=sl[0], on=a.st<=now, ttl=(s)=>esc(s.m)+(s.lab?" · "+s.lab:"");
    const others=a.ms.filter(p=>p.n!==me).map(p=>p.role==="מפקד"?`<b>${esc(p.n)}</b> (מפקד)`:p.role==="נהג"?`${esc(p.n)} (נהג)`:esc(p.n)).join(" · ");
    return `<div class="next"><div class="k">${on?"עכשיו במשימה":"המשימה הבאה שלך · "+whenLbl(a.st)}</div><div class="big">${ttl(a)}</div><div class="tm mono">${esc(a.time)}</div>${others?`<div class="with">עם ${others}</div>`:""}</div>`;
  }
  function renderMe(){
    $("#v-me").innerHTML=nextCard()||`<p class="muted">אין לך משימה בלוח כרגע.</p>`;
  }

  const DL=["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];
  const dOf=(iso)=>new Date(iso+"T00:00"), dTxt=(iso)=>{const d=dOf(iso);return `${DL[d.getDay()]} <span class="mono">${d.getDate()}.${d.getMonth()+1}</span>`;};
  const backTxt=(t)=>t.back?`חוזר ${dTxt(t.back)} עד 12:00`:"אין תאריך חזרה בתוכנית";
  function renderLeave(){
    const t0=isoToday(), trips=D.leave[me].trips;
    const cur=trips.find(t=>t.out<=t0&&(!t.back||t.back>t0)), nxt=trips.find(t=>t.out>t0);
    let h="";
    if(cur) h+=`<div class="lv-next"><span class="lbl">אתם בבית עכשיו</span><span class="big">${backTxt(cur)}</span></div>`;
    else if(nxt){const n=Math.round((dOf(nxt.out)-dOf(t0))/864e5);
      h+=`<div class="lv-next"><span class="lbl">היציאה הבאה שלך</span><div class="when"><span class="big">${dTxt(nxt.out)} בבוקר</span><span class="sub">${n===1?"מחר":`בעוד ${n} ימים`}</span></div><span class="sub">${backTxt(nxt)} · ${nxt.days} ימים בבית</span></div>`;}
    if(!trips.length){$("#v-leave").innerHTML=`<p class="muted">אין לך יציאות הביתה בתוכנית.</p>`;return;}
    h+=`<h2 class="lv-h">כל היציאות</h2><div class="trips">`+trips.map(t=>`<div class="trip${t.back&&t.back<=t0?" past":""}"><span class="d">יוצא ${dTxt(t.out)} בבוקר${t.cons?'<span class="tag">אילוץ</span>':""}</span><span class="n">${t.days} ימים</span><span class="r">${backTxt(t)}</span></div>`).join("")+`</div>`;
    h+=`<p class="lv-foot">התוכנית יכולה להשתנות. שינויים מתעדכנים כאן אחרי אישור המפקד.</p>`;
    $("#v-leave").innerHTML=h;
  }

  function render(){
    $("#hello").textContent=`שלום, ${me}`;
    document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",String(t.dataset.view===view)));
    $("#v-board").hidden=view!=="board"; $("#v-me").hidden=view!=="me"; $("#v-leave").hidden=view!=="leave";
    if(view==="board") renderBoard(); else if(view==="me") renderMe(); else renderLeave();
  }

  setInterval(()=>{if(D&&me) render();},30000);
  const saved=store.get("mp_pw"); if(saved) open(saved,true);
})();
</script>
</body></html>
