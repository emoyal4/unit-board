<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>לוח משימות פלוגתי</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Hebrew:wght@400;500;600&family=Secular+One&display=swap">
<style>
/* Layout: duty-roster board — day strip, three 8h shift bands with a card per mission, then 24h posts; tabs for "שלי" and fairness. */
:root{
  --bg:#f1f0ea; --surface:#fbfaf6; --ink:#1d221e; --muted:#676c63; --line:#d8d6cb; --accent:#2c5a4c; --accent-ink:#ffffff;
  --m-patrol:#355f91; --m-carmel:#4c7436; --m-yz:#a86a1f; --m-guard:#7d4872; --warn:#b4401a; --hl:#fff1b8; --hl-ink:#1d221e;
  --f-display:"Secular One","IBM Plex Sans Hebrew",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Hebrew",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121512; --surface:#1a1e1a; --ink:#e6e5de; --muted:#9a9e94; --line:#2d322d; --accent:#7fb5a2; --accent-ink:#0f1411;
  --m-patrol:#7ea6d8; --m-carmel:#94c07a; --m-yz:#e0a85c; --m-guard:#c993bd; --warn:#f08a5d; --hl:#5a4a12; --hl-ink:#fff6d6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121512; --surface:#1a1e1a; --ink:#e6e5de; --muted:#9a9e94; --line:#2d322d; --accent:#7fb5a2; --accent-ink:#0f1411;
  --m-patrol:#7ea6d8; --m-carmel:#94c07a; --m-yz:#e0a85c; --m-guard:#c993bd; --warn:#f08a5d; --hl:#5a4a12; --hl-ink:#fff6d6; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0}
h1{font-size:1.6rem;line-height:1.2}
h2{font-size:1.15rem}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* gate */
.gate{min-height:70vh;display:grid;place-items:center}
.gate form{display:grid;gap:12px;width:min(360px,100%);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px}
.gate input{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.btn{padding:10px 14px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer}
.err{color:var(--warn);min-height:1.5em;margin:0}

/* top */
header.top{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:8px 16px;margin-bottom:14px}
.badge{display:inline-block;font-size:.75rem;font-weight:600;letter-spacing:.04em;padding:2px 8px;border-radius:999px;border:1px solid var(--warn);color:var(--warn)}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.day{flex:0 0 auto;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-family:var(--f-mono)}
.day[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab{padding:8px 14px;border:0;background:none;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--accent);font-weight:600}
.testnote{border:1px dashed var(--warn);color:var(--warn);border-radius:8px;padding:8px 12px;margin-bottom:14px;font-size:.9rem}

/* board */
.meta{display:flex;flex-wrap:wrap;gap:6px 20px;margin-bottom:14px;font-size:.92rem}
.meta b{font-weight:600}
.band{display:grid;grid-template-columns:110px 1fr 1fr;gap:10px;align-items:stretch;margin-bottom:10px}
.band .when{display:flex;flex-direction:column;justify-content:center;gap:2px;border-inline-start:3px solid var(--line);padding-inline-start:10px}
.band.night .when{border-color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.card .k{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.card .k span:first-child{font-weight:600;font-size:.82rem;letter-spacing:.03em}
.card ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.card li{display:flex;justify-content:space-between;gap:8px;border-radius:4px;padding:1px 4px;margin-inline:-4px}
.card li .r{color:var(--muted);font-size:.8rem}
.card li.cmd .nm{font-weight:600}
.card li.me{background:var(--hl);color:var(--hl-ink)}
.card li.me .r{color:inherit}
.c-patrol .k span:first-child{color:var(--m-patrol)} .c-patrol{border-top:3px solid var(--m-patrol)}
.c-carmel .k span:first-child{color:var(--m-carmel)} .c-carmel{border-top:3px solid var(--m-carmel)}
.c-yz .k span:first-child{color:var(--m-yz)} .c-yz{border-top:3px solid var(--m-yz)}
.c-guard .k span:first-child{color:var(--m-guard)} .c-guard{border-top:3px solid var(--m-guard)}
.posts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
.colhead{display:grid;grid-template-columns:110px 1fr 1fr;gap:10px;margin-bottom:6px;font-size:.8rem;color:var(--muted)}
.empty{color:var(--muted);font-style:italic}
.now{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:12px 14px;margin-bottom:16px;display:grid;gap:10px}
.now .head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 12px}
.now .clock{font-family:var(--f-mono);font-size:1.5rem;font-variant-numeric:tabular-nums}
.now .live{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:600;color:var(--accent)}
.now .live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.now .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.now .cell{border-inline-start:3px solid var(--line);padding-inline-start:10px;min-width:0}
.now .cell .t{font-size:.8rem;color:var(--muted)}
.now .cell .who{font-weight:600}
.now .cell .rest{font-size:.88rem;color:var(--muted)}
.now .c-patrol{border-color:var(--m-patrol)} .now .c-carmel{border-color:var(--m-carmel)} .now .c-yz{border-color:var(--m-yz)} .now .c-guard{border-color:var(--m-guard)}
.band.is-now .when{border-color:var(--accent)}
.band.is-now .card{border-color:var(--accent)}
.card li.on{outline:2px solid var(--accent);outline-offset:-1px}
@media (prefers-reduced-motion:no-preference){.now .live::before{animation:pulse 2s ease-in-out infinite}}
@keyframes pulse{50%{opacity:.3}}
@media (max-width:640px){
  .band,.colhead{grid-template-columns:1fr}
  .colhead{display:none}
  .band .when{flex-direction:row;gap:10px;align-items:baseline;border-inline-start-width:3px}
  .posts{grid-template-columns:1fr}
}

/* me */
.me-pick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.me-pick input{flex:1 1 220px;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.mylist{display:grid;gap:8px}
.myrow{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat .v{font-family:var(--f-mono);font-size:1.4rem}
.stat .a{font-size:.8rem;color:var(--muted)}

/* fairness */
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:7px 10px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line)}
th{position:sticky;top:0;background:var(--surface);font-weight:600;font-size:.8rem;color:var(--muted);cursor:pointer;user-select:none}
th[aria-sort]{color:var(--ink)}
td:first-child,th:first-child{text-align:start}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr.avg td{color:var(--muted);font-style:italic}
tr.me td{background:var(--hl);color:var(--hl-ink)}
td.hi{color:var(--warn);font-weight:600}
.foot{margin-top:24px;font-size:.82rem;color:var(--muted)}
</style>

<div class="wrap" dir="rtl" lang="he">
  <section class="gate" id="gate">
    <form id="gateForm" autocomplete="off">
      <h1>לוח משימות</h1>
      <p class="muted" style="margin:0">הלוח מוצפן. הכניסו את סיסמת הפלוגה.</p>
      <label for="pw" class="muted" style="font-size:.85rem">סיסמה</label>
      <input id="pw" type="password" inputmode="text" autocomplete="current-password" required>
      <button class="btn" id="unlock" type="submit">פתיחה</button>
      <p class="err" id="err" role="alert"></p>
    </form>
  </section>

  <main id="app" hidden>
    <header class="top">
      <div>
        <h1 id="unit">לוח משימות</h1>
        <div class="muted" id="updated" style="font-size:.85rem"></div>
      </div>
      <button class="chip" id="lock" type="button">נעילה ושכחת סיסמה</button>
    </header>
    <div class="me-pick">
      <label for="meIn" class="muted" style="align-self:center">אני:</label>
      <input id="meIn" list="names" placeholder="הקלידו את השם שלכם" aria-label="השם שלי">
      <datalist id="names"></datalist>
    </div>
    <nav class="days" id="days" aria-label="ימים"></nav>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="t-board" aria-selected="true" data-view="board">לוח</button>
      <button class="tab" role="tab" id="t-me" aria-selected="false" data-view="me">שלי</button>
      <button class="tab" role="tab" id="t-fair" aria-selected="false" data-view="fair">הוגנות</button>
    </div>
    <div id="testnote" class="testnote" hidden>הדגמה בלבד — זה לא לוח אמיתי.</div>
    <section id="v-board"></section>
    <section id="v-me" hidden></section>
    <section id="v-fair" hidden></section>
    <p class="foot">הלוח מתעדכן בכל ערב אחרי אישור. שינויים של הרגע האחרון מופיעים בגיליון לפני שהם מגיעים לכאן.</p>
  </main>
</div>

  const b64=(s)=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const P=JSON.parse($("#payload").textContent);
  let D=null, day=null, me=store.get("mp_me")||"", view="board", sortKey="shifts", sortDir=-1, dept="";
  const KCLASS={duty:"c-yz",guard:"c-guard"}, CREWCLASS=["c-patrol","c-carmel"];
  const mcls=(m)=>m.kind==="crew"?CREWCLASS[day.missions.filter(x=>x.kind==="crew").indexOf(m)]||"":KCLASS[m.kind];

  async function decrypt(pw){
    const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.salt),iterations:P.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
    const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.iv)},key,b64(P.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  async function open(pw,silent){
    try{ D=await decrypt(pw); }catch(e){ if(!silent) $("#err").textContent="הסיסמה לא נכונה. נסו שוב או בקשו את הסיסמה העדכנית מהמפקד."; store.del("mp_pw"); return; }
    store.set("mp_pw",pw);
    $("#gate").hidden=true; $("#app").hidden=false;
    day=D.days[D.days.length-1];
    setupPicker();
    render();
  }
  $("#gateForm").addEventListener("submit",(e)=>{e.preventDefault();$("#err").textContent="";open($("#pw").value,false);});
  $("#lock").addEventListener("click",()=>{store.del("mp_pw");D=null;$("#app").hidden=true;$("#gate").hidden=false;$("#pw").value="";});
  document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{view=t.dataset.view;render();}));

  function li(p){const cmd=p.role==="מפקד";return `<li class="${cmd?"cmd":""}${p.n===me?" me":""}"><span class="nm">${esc(p.n)}</span><span class="r">${esc(p.role)}</span></li>`;}
  function crewCard(m,c){return `<div class="card ${mcls(m)}"><div class="k"><span>${esc(m.name)}</span><span class="mono muted">${esc(c.time)}</span></div>${c.members.length?`<ul>${c.members.map(li).join("")}</ul>`:`<div class="empty">לא שובץ</div>`}</div>`;}

  const hr=(s)=>{const [a,b]=s.split(":");return +a+(+b||0)/60;};
  const pad=(n)=>String(n).padStart(2,"0");
  function nowFor(){
    const s0=day.shifts[0].split("–")[0];
    const d=new Date(), t=d.getHours()+d.getMinutes()/60, start=hr(s0);
    const bd=new Date(d); if(t<start) bd.setDate(bd.getDate()-1);
    const iso=`${bd.getFullYear()}-${pad(bd.getMonth()+1)}-${pad(bd.getDate())}`;
    const live=D.days.find(x=>x.date===iso);
    const target=live||(day.test?day:null);
    if(!target||target!==day) return null;
    const since=(s)=>(t-hr(s)+24)%24;
    const sg=day.missions.find(m=>m.kind==="guard"), yz=day.missions.find(m=>m.kind==="duty");
    return {live:!!live, clock:`${pad(d.getHours())}:${pad(d.getMinutes())}`,
      shift:Math.floor(since(s0)/8)%3,
      turn:sg?sg.turns.find(x=>since(x.time.split("–")[0])<4):null,
      yzOn:yz?since(yz.start)<yz.duration:false};
  }
  function renderNow(N){
    const crews=day.missions.filter(m=>m.kind==="crew"), yz=day.missions.find(m=>m.kind==="duty");
    const who=(ms)=>{const c=ms.find(p=>p.role==="מפקד")||ms[0];return c?`<div class="who">${esc(c.n)}</div><div class="rest">${ms.filter(p=>p!==c).map(p=>esc(p.n)).join(" · ")}</div>`:`<div class="rest">לא שובץ</div>`;};
    let h=`<div class="now" aria-live="polite"><div class="head"><span class="live">${N.live?"עכשיו במשימה":"הדגמה: השעה עכשיו על לוח "+esc(day.label)}</span><span class="clock">${N.clock}</span></div><div class="grid">`;
    crews.forEach(m=>{const c=m.crews[N.shift];h+=`<div class="cell ${mcls(m)}"><div class="t">${esc(m.name)} · <span class="mono">${esc(c.time)}</span></div>${who(c.members)}</div>`;});
    if(N.turn) h+=`<div class="cell c-guard"><div class="t">${esc(day.missions.find(m=>m.kind==="guard").name)} · <span class="mono">${esc(N.turn.time)}</span></div><div class="who">${esc(N.turn.n)}</div></div>`;
    if(yz) h+=`<div class="cell c-yz"><div class="t">${esc(yz.name)} · <span class="mono">${esc(yz.time)}</span></div>${N.yzOn?who(yz.members):`<div class="rest">לא בפעילות עכשיו · כוננות</div>`}</div>`;
    return h+`</div></div>`;
  }

  function renderBoard(){
    const crews=day.missions.filter(m=>m.kind==="crew");
    const yz=day.missions.find(m=>m.kind==="duty"), sg=day.missions.find(m=>m.kind==="guard");
    const N=nowFor();
    let h=(N?renderNow(N):"")+`<div class="meta"><span>תאריך: <b class="mono">${esc(day.sheet_date)}</b></span><span>קצין תורן: <b>${esc(day.officer||"—")}</b></span><span>מפקד גזרה: <b>${esc(day.sector||"—")}</b></span><span>בבסיס: <b class="mono">${day.on_base}</b></span></div>`;
    h+=`<div class="colhead"><span>משמרת</span>${crews.map(m=>`<span>${esc(m.name)}</span>`).join("")}</div>`;
    day.shifts.forEach((t,i)=>{
      h+=`<div class="band${i===2?" night":""}${N&&N.shift===i?" is-now":""}"><div class="when"><span class="mono">${esc(t)}</span><span class="muted" style="font-size:.8rem">${["בוקר","ערב","לילה"][i]||""}</span></div>${crews.map(m=>crewCard(m,m.crews[i])).join("")}</div>`;
    });
    h+=`<div class="posts">`;
    if(yz) h+=`<div class="card c-yz"><div class="k"><span>${esc(yz.name)} · 24 ש׳</span><span class="mono muted">${esc(yz.time)}</span></div><ul>${yz.members.map(li).join("")}</ul></div>`;
    if(sg) h+=`<div class="card c-guard"><div class="k"><span>${esc(sg.name)} · 4/8</span><span></span></div><ul>${sg.turns.map(t=>`<li class="${t.n===me?"me":""}${N&&N.turn===t?" on":""}"><span class="nm">${esc(t.n)}</span><span class="r mono">${esc(t.time)}</span></li>`).join("")}</ul></div>`;
    h+=`</div>`;
    $("#v-board").innerHTML=h;
  }

  function slotFor(d,n){
    for(const m of d.missions){
      if(m.kind==="crew") for(const c of m.crews){const p=c.members.find(x=>x.n===n); if(p) return {m:m.name,t:c.time,r:p.role};}
      if(m.kind==="duty"){const p=m.members.find(x=>x.n===n); if(p) return {m:m.name,t:m.time,r:p.role};}
      if(m.kind==="guard"){const ts=m.turns.filter(x=>x.n===n).map(x=>x.time); if(ts.length) return {m:m.name,t:ts.join(" · "),r:"שומר"};}
    }
    if(d.spares.includes(n)) return {m:"ללא משימה",t:"",r:""};
    return null;
  }
  function avg(k){const ps=D.people;return ps.reduce((a,p)=>a+(k in p.mix?p.mix[k]:p[k]),0)/ps.length;}
  function renderMe(){
    let h="";
    const p=D.people.find(x=>x.n===me);
    if(!p){h+=`<p class="muted">בחרו את השם שלכם בשדה "אני" למעלה כדי לראות את המשימות וההוגנות שלכם. השם נשמר רק בטלפון הזה.</p>`;}
    else{
      h+=`<div class="mylist">`+D.days.slice().reverse().map(d=>{const s=slotFor(d,me);return `<div class="myrow"><span class="mono">${esc(d.label)}</span><span>${s?`<b>${esc(s.m)}</b> ${s.r?`<span class="muted">· ${esc(s.r)}</span>`:""}`:`<span class="muted">לא בבסיס</span>`}</span><span class="mono muted">${s?esc(s.t):""}</span></div>`}).join("")+`</div>`;
      const st=[["משמרות","shifts"],["לילות","nights"],["8/8","rest8"],...Object.keys(p.mix).map(k=>[k,k])];
      h+=`<div class="stats">${st.map(([l,k])=>`<div class="stat"><div class="muted" style="font-size:.82rem">${l}</div><div class="v">${k in p.mix?p.mix[k]:p[k]}</div><div class="a">ממוצע ${avg(k).toFixed(1)}</div></div>`).join("")}</div>`;
    }
    $("#v-me").innerHTML=h;
  }
  function setupPicker(){
    const names=D.people.map(p=>p.n), inp=$("#meIn");
    $("#names").innerHTML=names.map(n=>`<option value="${esc(n)}">`).join("");
    inp.value=names.includes(me)?me:"";
    inp.onchange=()=>{const v=inp.value.trim(); if(names.includes(v)||v===""){me=v; v?store.set("mp_me",v):store.del("mp_me"); render();}};
  }

  const BASECOLS=[["שם","n"],["מחלקה","dept"],["ימים בבסיס","on_base"],["משמרות","shifts"],["לילות","nights"],["8/8","rest8"]];
  const val=(p,k)=>k in p.mix?p.mix[k]:p[k];
  function renderFair(){
    const COLS=[...BASECOLS,...Object.keys(D.people[0].mix).map(k=>[k,k])];
    const depts=[...new Set(D.people.map(p=>p.dept))];
    let rows=D.people.filter(p=>!dept||p.dept===dept);
    rows=rows.slice().sort((a,b)=>{const x=val(a,sortKey),y=val(b,sortKey);return (typeof x==="number"?(x-y):String(x).localeCompare(String(y),"he"))*sortDir;});
    const nums=COLS.slice(2).map(c=>c[1]);
    const mean={}; nums.forEach(k=>mean[k]=rows.length?rows.reduce((a,p)=>a+val(p,k),0)/rows.length:0);
    let h=`<div class="filters">${["",...depts].map(d=>`<button class="chip" type="button" data-dept="${esc(d)}" aria-pressed="${d===dept}">${d?esc(d):"כולם"}</button>`).join("")}</div>`;
    h+=`<p class="muted" style="margin:0 0 8px;font-size:.88rem">מעל הממוצע ביותר מ-1 מסומן. סדר העדיפויות: משמרות, 8/8, לילות, תמהיל משימות.</p>`;
    h+=`<div class="tablewrap"><table><thead><tr>${COLS.map(([l,k])=>`<th data-k="${k}"${k===sortKey?` aria-sort="${sortDir<0?"descending":"ascending"}"`:""}>${l}${k===sortKey?(sortDir<0?" ↓":" ↑"):""}</th>`).join("")}</tr></thead><tbody>`;
    h+=`<tr class="avg"><td>ממוצע</td><td></td>${nums.map(k=>`<td class="n">${mean[k].toFixed(1)}</td>`).join("")}</tr>`;
    h+=rows.map(p=>`<tr class="${p.n===me?"me":""}"><td>${esc(p.n)}</td><td>${esc(p.dept.replace("מחלקה ",""))}</td>${nums.map(k=>{const v=val(p,k);const hi=k!=="on_base"&&v-mean[k]>1;return `<td class="n${hi?" hi":""}">${v}</td>`}).join("")}</tr>`).join("");
    h+=`</tbody></table></div>`;
    $("#v-fair").innerHTML=h;
    document.querySelectorAll("#v-fair th").forEach(th=>th.addEventListener("click",()=>{const k=th.dataset.k; if(k===sortKey) sortDir*=-1; else {sortKey=k; sortDir=(k==="n"||k==="dept")?1:-1;} renderFair();}));
    document.querySelectorAll("#v-fair .chip").forEach(c=>c.addEventListener("click",()=>{dept=c.dataset.dept;renderFair();}));
  }

  function render(){
    $("#unit").textContent=D.unit||"לוח משימות";
    $("#updated").textContent=`${D.days.length} ימים בלוח · עודכן ${D.published||""}`;
    $("#days").innerHTML=D.days.map(d=>`<button class="day" type="button" data-date="${d.date}" aria-pressed="${d===day}">${esc(d.label)}${d.test?' <span class="badge">TEST</span>':""}</button>`).join("");
    document.querySelectorAll(".day").forEach(b=>b.addEventListener("click",()=>{day=D.days.find(d=>d.date===b.dataset.date);render();}));
    $("#testnote").hidden=!D.days.some(d=>d.test);
    document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",String(t.dataset.view===view)));
    $("#v-board").hidden=view!=="board"; $("#v-me").hidden=view!=="me"; $("#v-fair").hidden=view!=="fair";
    if(view==="board") renderBoard(); else if(view==="me") renderMe(); else renderFair();
  }

  setInterval(()=>{if(D&&view==="board") renderBoard();},30000);
  const saved=store.get("mp_pw"); if(saved) open(saved,true);
})();
</script>
</body></html>
